name: Deploy MMAD leaderboard

on:
  push:
    branches: [main]
    paths:
      - index.html
      - LEADERBOARD.md
      - .github/workflows/leaderboard-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: leaderboard-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the published results
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package the static website
        shell: python
        run: |
          from pathlib import Path
          import shutil
          destination = Path('_site')
          destination.mkdir()
          for name in ('index.html', 'LEADERBOARD.md'):
              shutil.copyfile(name, destination / name)
          (destination / '.nojekyll').touch()
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy the leaderboard
        id: deployment
        uses: actions/deploy-pages@v4
